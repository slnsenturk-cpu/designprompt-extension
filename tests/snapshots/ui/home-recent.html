<h1 class="vd-tabtitle">Overview</h1>
<div class="vd-seg" role="radiogroup" id="vdModeSeg" aria-label="Analysis mode">
<button class="vd-seg__item is-on" role="radio" aria-checked="true" data-mode="page">Page</button>
<button class="vd-seg__item" role="radio" aria-checked="false" data-mode="element">Element</button>
</div>
<div class="vd-home__action">
<button class="vd-btn vd-btn--primary vd-btn--full" id="analyzeBtn" aria-label="Analyze page">
<span class="vd-btn__label">Analyze page</span>
</button>
<p class="vd-home__help">Reads colors, type, spacing, components, motion and hover states from this page.</p>
<p class="vd-ai">AI enhancement off · <button class="vd-ai__link" data-action="openSettings">Turn on</button>
</p>
</div>
<section class="vd-section">
<div class="vd-section__head">
<h2 class="vd-section__title">Recent</h2>
</div>
<div class="vd-section__body">
<button class="vd-recent" data-restore="a">
<span class="vd-recent__domain">linear.app</span>
<span class="vd-recent__ago">2h ago</span>
<span class="vd-recent__meta">
</span>
</button>
<button class="vd-recent" data-restore="b">
<span class="vd-recent__domain">example.com</span>
<span class="vd-recent__ago">1d ago</span>
<span class="vd-recent__meta">colors</span>
</button>
</div>
</section>
