<h1 class="vd-tabtitle">Overview</h1>
<div class="vd-seg" role="radiogroup" id="vdSourceSeg" aria-label="Source">
<button class="vd-seg__item" role="radio" aria-checked="false" data-source="website">Website</button>
<button class="vd-seg__item is-on" role="radio" aria-checked="true" data-source="image">Image</button>
</div>
<div class="vd-notice vd-notice--warn" id="vdImageGate" role="status">
<span class="vd-notice__text">Image analysis needs AI enhancement. Your image goes only to your chosen AI provider.</span>
<button class="vd-notice__action" data-action="openSettings">Turn on</button>
</div>
<div class="vd-drop is-gated" id="vdDropZone" role="button" tabindex="-1" aria-disabled="true" aria-label="Drop an image or click to choose">
<span class="vd-drop__label">Drop an image or click to choose</span>
<span class="vd-drop__hint">PNG, JPG or WebP · up to 8 MB</span>
</div>
<input type="file" id="vdImageInput" accept="image/png,image/jpeg,image/webp" hidden />
<div class="vd-home__action">
<button class="vd-btn vd-btn--primary vd-btn--full" id="analyzeImageBtn" aria-label="Analyze image" disabled>
<span class="vd-btn__label">Analyze image</span>
</button>
<p class="vd-home__help">Reads the visual language from a static image: palette, type direction, shape, iconography. Estimated, not measured.</p>
<p class="vd-ai">AI enhancement off · <button class="vd-ai__link" data-action="openSettings">Turn on</button>
</p>
</div>
