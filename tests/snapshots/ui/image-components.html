<h1 class="vd-tabtitle">Components</h1>
<section class="vd-section">
<div class="vd-section__head">
<h2 class="vd-section__title">Components</h2>
<button class="vd-section__action" data-action="gotoExport">Export ▸</button>
</div>
<div class="vd-section__body">
<div class="vd-kv">
<span class="vd-kv__label">Shape language</span>
<span class="vd-kv__value">soft</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv">
<span class="vd-kv__label">Icon style</span>
<span class="vd-kv__value">stroke</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv">
<span class="vd-kv__label">Icon weight</span>
<span class="vd-kv__value vd-kv__value--mono">1.5px</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv">
<span class="vd-kv__label">Icon corners</span>
<span class="vd-kv__value">rounded</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv">
<span class="vd-kv__label">Icon grid</span>
<span class="vd-kv__value vd-kv__value--mono">24px</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv vd-kv--stacked">
<span class="vd-kv__label">Illustration / texture</span>
<span class="vd-kv__value vd-kv__value--wrap">none</span>
<span class="vd-kv__meta">est.</span>
</div>
<div class="vd-kv">
<span class="vd-kv__label">Density</span>
<span class="vd-kv__value">airy</span>
<span class="vd-kv__meta">est.</span>
</div>
</div>
</section>
